{% load static %}
<div class="m-scrim" data-mobile-scrim hidden></div>
<aside class="m-mobile" id="mMobileMenu" data-mobile-menu aria-label="Mobile navigation" hidden>
    <div class="m-mobile-head">
        <span class="m-brand-text">PC Ramduhawma</span>
        <button type="button" class="m-mobile-close" data-mobile-close aria-label="Close navigation menu">✕</button>
    </div>
    <nav class="m-mobile-links">
        <a href="{% url 'core:home' %}" class="m-mobile-link{% if active_nav == 'home' %} is-active{% endif %}"{% if active_nav == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="{% url 'core:about' %}" class="m-mobile-link{% if active_nav == 'about' %} is-active{% endif %}"{% if active_nav == 'about' %} aria-current="page"{% endif %}>About</a>
        <a href="{% url 'blog:post_list' %}" class="m-mobile-link{% if active_nav == 'blog' %} is-active{% endif %}"{% if active_nav == 'blog' %} aria-current="page"{% endif %}>Blog</a>
        <a href="{% url 'projects:project_list' %}" class="m-mobile-link{% if active_nav == 'projects' %} is-active{% endif %}"{% if active_nav == 'projects' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{% url 'software:software_list' %}" class="m-mobile-link{% if active_nav == 'software' %} is-active{% endif %}"{% if active_nav == 'software' %} aria-current="page"{% endif %}>Software</a>
        <div class="m-mobile-group" data-dropdown>
            <button type="button" class="m-mobile-link m-mobile-more" data-dropdown-btn aria-haspopup="true" aria-expanded="false">More <span class="m-dropdown-caret" aria-hidden="true">›</span></button>
            <div class="m-mobile-sub" data-dropdown-menu hidden>
                <a href="{% url 'gallery:gallery_list' %}" class="m-mobile-link m-mobile-sub-link{% if active_nav == 'gallery' %} is-active{% endif %}">Gallery</a>
                <a href="{% url 'guestbook:guestbook_list' %}" class="m-mobile-link m-mobile-sub-link{% if active_nav == 'guestbook' %} is-active{% endif %}">Guestbook</a>
                <a href="{% url 'core:contact' %}" class="m-mobile-link m-mobile-sub-link{% if active_nav == 'contact' %} is-active{% endif %}">Contact</a>
            </div>
        </div>
    </nav>
    <div class="m-mobile-foot">
        <button type="button" class="m-theme-btn m-theme-btn-wide" data-theme-toggle aria-pressed="false" aria-label="Switch to modern mode"><span data-theme-icon aria-hidden="true">✨</span> <span data-theme-label>Modern</span></button>
    </div>
</aside>
