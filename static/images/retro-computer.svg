<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <!-- Desktop Tower -->
  <rect x="90" y="40" width="20" height="55" fill="#d4c8a0"/>
  <rect x="91" y="41" width="18" height="53" fill="#e8dcc0"/>
  <rect x="92" y="42" width="16" height="51" fill="#d4c8a0"/>
  <!-- Tower drive bays -->
  <rect x="93" y="44" width="14" height="6" fill="#b8a880"/>
  <rect x="94" y="45" width="12" height="4" fill="#a09070"/>
  <rect x="93" y="52" width="14" height="6" fill="#b8a880"/>
  <rect x="94" y="53" width="12" height="4" fill="#a09070"/>
  <!-- Tower power button -->
  <rect x="97" y="62" width="6" height="4" fill="#888"/>
  <rect x="98" y="63" width="4" height="2" fill="#6a6"/>
  <!-- Tower vents -->
  <rect x="93" y="70" width="14" height="1" fill="#b8a880"/>
  <rect x="93" y="73" width="14" height="1" fill="#b8a880"/>
  <rect x="93" y="76" width="14" height="1" fill="#b8a880"/>
  <rect x="93" y="79" width="14" height="1" fill="#b8a880"/>
  <!-- Tower bottom -->
  <rect x="90" y="93" width="20" height="3" fill="#b8a880"/>
  
  <!-- CRT Monitor Body -->
  <rect x="10" y="8" width="72" height="60" fill="#d4c8a0"/>
  <rect x="11" y="9" width="70" height="58" fill="#e8dcc0"/>
  <!-- Monitor top shadow -->
  <rect x="12" y="10" width="68" height="3" fill="#f0e8d0"/>
  <!-- Monitor left highlight -->
  <rect x="12" y="10" width="3" height="54" fill="#f0e8d0"/>
  <!-- Monitor right shadow -->
  <rect x="77" y="10" width="3" height="54" fill="#c0b490"/>
  <!-- Monitor bottom shadow -->
  <rect x="12" y="64" width="68" height="3" fill="#c0b490"/>
  
  <!-- CRT Bezel -->
  <rect x="16" y="13" width="60" height="48" fill="#c0b490"/>
  <rect x="17" y="14" width="58" height="46" fill="#b0a480"/>
  
  <!-- Screen -->
  <rect x="20" y="16" width="52" height="40" fill="#001133"/>
  <rect x="21" y="17" width="50" height="38" fill="#001845"/>
  
  <!-- Screen glow effect -->
  <rect x="22" y="18" width="48" height="36" fill="#001d55"/>
  
  <!-- Screen text - cycles messages with SMIL timing -->
  <g font-family="'Courier New', monospace" font-size="7" font-weight="bold" fill="#00cc44" text-anchor="middle">
    <g visibility="hidden">
      <set attributeName="visibility" to="visible" begin="0s;4.8s" dur="1.2s"/>
      <text x="46" y="30">HELLO</text>
      <text x="46" y="42">WORLD!</text>
    </g>
    <g visibility="hidden">
      <set attributeName="visibility" to="visible" begin="1.2s;6s" dur="1.2s"/>
      <text x="46" y="30">WELCOME!</text>
      <text x="46" y="42">SURFER!</text>
    </g>
    <g visibility="hidden">
      <set attributeName="visibility" to="visible" begin="2.4s;7.2s" dur="1.2s"/>
      <text x="46" y="30">I LOVE</text>
      <text x="46" y="42">DJANGO!</text>
    </g>
    <g visibility="hidden">
      <set attributeName="visibility" to="visible" begin="3.6s;8.4s" dur="1.2s"/>
      <text x="46" y="30">PYTHON</text>
      <text x="46" y="42">ROCKS!</text>
    </g>
  </g>
  <rect x="44" y="46" width="4" height="2" fill="#00cc44">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Screen scanlines -->
  <rect x="21" y="20" width="50" height="1" fill="#001540" opacity="0.3"/>
  <rect x="21" y="24" width="50" height="1" fill="#001540" opacity="0.3"/>
  <rect x="21" y="28" width="50" height="1" fill="#001540" opacity="0.3"/>
  <rect x="21" y="32" width="50" height="1" fill="#001540" opacity="0.3"/>
  <rect x="21" y="36" width="50" height="1" fill="#001540" opacity="0.3"/>
  <rect x="21" y="40" width="50" height="1" fill="#001540" opacity="0.3"/>
  <rect x="21" y="44" width="50" height="1" fill="#001540" opacity="0.3"/>
  <rect x="21" y="48" width="50" height="1" fill="#001540" opacity="0.3"/>
  
  <!-- Screen power LED -->
  <rect x="42" y="60" width="3" height="2" fill="#00aa00"/>
  <rect x="43" y="60" width="1" height="2" fill="#00ff00"/>
  
  <!-- Monitor stand -->
  <rect x="35" y="68" width="22" height="4" fill="#d4c8a0"/>
  <rect x="36" y="69" width="20" height="2" fill="#e8dcc0"/>
  <rect x="38" y="72" width="16" height="3" fill="#c0b490"/>
  <rect x="32" y="75" width="28" height="3" fill="#d4c8a0"/>
  <rect x="33" y="76" width="26" height="1" fill="#e8dcc0"/>
  
  <!-- Keyboard -->
  <rect x="12" y="82" width="68" height="14" fill="#d4c8a0"/>
  <rect x="13" y="83" width="66" height="12" fill="#e8dcc0"/>
  <rect x="14" y="84" width="64" height="10" fill="#d4c8a0"/>
  <!-- Keyboard top highlight -->
  <rect x="14" y="84" width="64" height="2" fill="#f0e8d0"/>
  
  <!-- Keyboard keys row 1 -->
  <rect x="16" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="21" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="26" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="31" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="36" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="41" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="46" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="51" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="56" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="61" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="66" y="86" width="4" height="3" fill="#c0b490"/>
  <rect x="71" y="86" width="4" height="3" fill="#c0b490"/>
  
  <!-- Keyboard keys row 2 -->
  <rect x="18" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="23" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="28" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="33" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="38" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="43" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="48" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="53" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="58" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="63" y="90" width="4" height="3" fill="#c0b490"/>
  <rect x="68" y="90" width="4" height="3" fill="#c0b490"/>
  
  <!-- Spacebar -->
  <rect x="28" y="94" width="20" height="2" fill="#c0b490"/>
  
  <!-- Keyboard bottom -->
  <rect x="14" y="96" width="64" height="2" fill="#b8a880"/>
  
  <!-- Mouse -->
  <rect x="86" y="88" width="10" height="14" fill="#d4c8a0"/>
  <rect x="87" y="89" width="8" height="12" fill="#e8dcc0"/>
  <rect x="88" y="90" width="6" height="4" fill="#c0b490"/>
  <!-- Mouse buttons -->
  <rect x="88" y="90" width="3" height="4" fill="#b8a880"/>
  <rect x="91" y="90" width="3" height="4" fill="#b8a880"/>
  <!-- Mouse center line -->
  <rect x="90" y="90" width="1" height="4" fill="#a09070"/>
  <!-- Mouse wheel -->
  <rect x="90" y="91" width="1" height="2" fill="#888"/>
  <!-- Mouse cord -->
  <rect x="91" y="85" width="1" height="3" fill="#888"/>
  <rect x="92" y="83" width="1" height="2" fill="#888"/>
  <rect x="93" y="82" width="1" height="1" fill="#888"/>
  <!-- Mouse bottom -->
  <rect x="87" y="100" width="8" height="2" fill="#b8a880"/>
</svg>
